name: AI Review Hardening

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ai-review-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ai-review-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify AI review hardening regressions
        shell: bash
        run: bash scripts/diagnostics/verify-ai-review-hardening.sh
